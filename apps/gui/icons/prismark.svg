  <polygon points="35.0,18 62,18 62,26 39.0,26" fill="#0c1430"/>
  <polygon points="41.0,30 62,30 62,38 45.0,38" fill="#2d5bff"/>
  <polygon points="47.0,42 62,42 62,54 53.0,54" fill="#0c1430"/>
