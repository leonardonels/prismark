[project]
name = "prismark-analyzer"
version = "0.2.0"
description = "Research and plotting tools for Prismark result files (outside the measurement path)"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.scripts]
prismark-analyze = "prismark_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prismark_analyzer"]
