<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prismark, Measuring</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Saira:wdth,wght@50..125,100..900&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 402px; height: 874px; box-sizing: border-box; position: relative; overflow: hidden; background: #2D5BFF; color: #F7F8F9; font-family: Archivo, sans-serif; padding: 62px 20px 34px; display: flex; flex-direction: column; gap: 16px">
  <div aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(#5C80FF 1.2px, transparent 1.4px); background-size: 22px 22px"></div>

  <div style="position: relative; display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.06em">
    <span>RUN / MEASURING</span><span>FULL RUN</span>
  </div>

  <!-- the seat tile: part number turned on its side -->
  <section style="position: relative; flex: 1; min-height: 0; background: #D6F53B; color: #0C1430; display: flex; overflow: hidden">
    <div style="flex: none; width: 196px; display: flex; align-items: center; justify-content: center; overflow: hidden">
      <span style="writing-mode: vertical-rl; font-family: Saira, sans-serif; font-variation-settings: 'wdth' 50; font-weight: 600; font-size: 236px; line-height: 0.8; letter-spacing: -0.01em; white-space: nowrap">07/14</span>
    </div>
    <div style="flex: 1; min-width: 0; padding: 18px 16px 18px 6px; display: flex; flex-direction: column; justify-content: space-between">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">Part:</span>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em">NOW</span>
        <h1 style="margin: 0; font-family: Saira, sans-serif; font-variation-settings: 'wdth' 100; font-weight: 700; font-size: 25px; line-height: 1.05">One core, after warming up</h1>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.35">3D rendering, one core</span>
      </div>
    </div>
  </section>

  <div aria-hidden="true" style="position: relative; display: flex; gap: 3px; height: 14px">
    <sc-for list="{{parts}}" as="p" hint-placeholder-count="14"><span style="{{p.style}}"></span></sc-for>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 8px">
    <p style="margin: 0; font-weight: 600; font-size: 19px; line-height: 1.25">Leave the iPhone on a table and do not touch it.</p>
    <p style="margin: 0; font-size: 14px; line-height: 1.4">A touch skips the tests that measure waking up. The screen stays on and does not change while a test measures.</p>
  </div>

  <a href="PhoneCancel.dc.html" style="position: relative; height: 60px; box-sizing: border-box; border: 2px solid #F7F8F9; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px">Cancel run</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  renderVals() {
    const total = 14, current = 6;
    const parts = Array.from({ length: total }, (_, i) => ({
      style: 'flex: 1; box-sizing: border-box; ' + (i < current ? 'background: #0C1430;' : i === current ? 'background: #D6F53B;' : 'border: 1.5px solid #9DB3FF;')
    }));
    return { parts };
  }
}
</script>
</body>
</html>
