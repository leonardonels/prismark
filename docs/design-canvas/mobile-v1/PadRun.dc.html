<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prismark, iPad run</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Saira:wdth,wght@50..125,100..900&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 820px; height: 1180px; box-sizing: border-box; background: #0C1430; display: flex; flex-direction: column; gap: 6px; font-family: Archivo, sans-serif; color: #0C1430; overflow: hidden">

  <!-- the machine pass -->
  <section style="flex: 1; min-height: 0; position: relative; overflow: hidden; background: #2D5BFF; color: #F7F8F9; padding: 40px 28px 20px; display: flex; gap: 28px">
    <div aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(#5C80FF 1.2px, transparent 1.4px); background-size: 24px 24px"></div>
    <div style="position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 10px; align-self: flex-start; height: 48px; padding: 0 14px; background: #D6F53B; color: #0C1430">
        <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
          <path d="M0 37 L21.5 34" stroke="#0C1430" stroke-width="3" fill="none"></path>
          <polygon points="12,52 32,12 52,52" fill="#0C1430"></polygon>
          <rect x="42" y="25" width="22" height="5" fill="#0C1430"></rect>
          <rect x="46.5" y="34" width="17.5" height="5" fill="#2D5BFF"></rect>
          <rect x="51" y="43" width="13" height="5" fill="#0C1430"></rect>
        </svg>
        <span style="font-family: Saira, sans-serif; font-variation-settings: 'wdth' 125; font-weight: 800; font-size: 17px">PRISMARK</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">Processor:</span>
        <h1 style="margin: 0; font-family: Saira, sans-serif; font-variation-settings: 'wdth' 50; font-weight: 600; font-size: 240px; line-height: 0.76; letter-spacing: -0.02em; color: #0C1430">M2</h1>
      </div>
    </div>
    <dl style="position: relative; flex: none; width: 240px; margin: 0; align-self: flex-end; display: flex; flex-direction: column; gap: 10px">
      <div style="padding-top: 8px; border-top: 1px solid #9DB3FF"><dt style="font-family: 'IBM Plex Mono', monospace; font-size: 11px">MODEL</dt><dd style="margin: 2px 0 0; font-weight: 600; font-size: 15px">iPad Air</dd></div>
      <div style="padding-top: 8px; border-top: 1px solid #9DB3FF"><dt style="font-family: 'IBM Plex Mono', monospace; font-size: 11px">CORES</dt><dd style="margin: 2px 0 0; font-weight: 600; font-size: 15px">4 fast + 4 efficient</dd></div>
      <div style="padding-top: 8px; border-top: 1px solid #9DB3FF"><dt style="font-family: 'IBM Plex Mono', monospace; font-size: 11px">MEMORY</dt><dd style="margin: 2px 0 0; font-weight: 600; font-size: 15px">8 GB</dd></div>
      <div style="padding-top: 8px; border-top: 1px solid #9DB3FF"><dt style="font-family: 'IBM Plex Mono', monospace; font-size: 11px">SYSTEM</dt><dd style="margin: 2px 0 0; font-weight: 600; font-size: 15px">iPadOS 27.2</dd></div>
    </dl>
  </section>

  <!-- every test in reach, no second screen -->
  <section aria-label="Tests" style="flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: 382px 250px; gap: 6px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div style="{{g.tileStyle}}">
        <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; padding: 12px 16px 8px">
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px">{{g.num}}</span>
            <span style="font-family: Saira, sans-serif; font-variation-settings: 'wdth' 112; font-weight: 700; font-size: 23px; line-height: 1">{{g.name}}</span>
          </span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px">{{g.count}}</span>
        </div>
        <sc-for list="{{g.tests}}" as="x" hint-placeholder-count="4">
          <button aria-pressed="{{x.on}}" style="height: 44px; flex: none; width: 100%; box-sizing: border-box; border: 0; border-top: 1px solid {{g.line}}; background: transparent; color: inherit; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-align: left">
            <span style="{{x.boxStyle}}"><span style="{{x.dotStyle}}"></span></span>
            <span style="font-family: Archivo, sans-serif; font-weight: 600; font-size: 15px">{{x.name}}</span>
          </button>
        </sc-for>
      </div>
    </sc-for>
  </section>

  <!-- run -->
  <section style="flex: none; display: flex; gap: 6px; background: #F7F8F9; padding: 6px">
    <div style="flex: none; width: 300px; height: 72px; box-sizing: border-box; padding: 0 14px; background: #E8ECEF; display: flex; align-items: center; gap: 12px">
      <button aria-pressed="false" style="flex: none; border: 0; padding: 4px 6px; background: #C9D0DA; display: flex; align-items: center; gap: 6px; min-height: 44px">
        <span style="width: 18px; height: 18px; background: #343E5A"></span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: #1E2742">OFF</span>
      </button>
      <span style="display: flex; flex-direction: column; gap: 1px">
        <span style="font-weight: 700; font-size: 14px">Quick</span>
        <span style="font-size: 12px; line-height: 1.2; color: #3B4660">A first look, not ranked.</span>
      </span>
    </div>
    <button style="flex: 1; height: 72px; border: 0; background: #D6F53B; color: #0C1430; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; font-family: Saira, sans-serif; font-variation-settings: 'wdth' 125; font-weight: 800; font-size: 20px">
      <span>RUN 17 TESTS</span>
      <svg viewBox="0 0 34 16" width="36" height="17" fill="currentColor" aria-hidden="true"><polygon points="0,0 5,0 12,8 5,16 0,16 7,8"></polygon><polygon points="11,0 16,0 23,8 16,16 11,16 18,8"></polygon><polygon points="22,0 27,0 34,8 27,16 22,16 29,8"></polygon></svg>
    </button>
  </section>

  <nav aria-label="Sections" style="flex: none; display: flex; gap: 6px; padding-bottom: 20px">
    <a href="#" aria-current="page" style="flex: 1; height: 58px; box-sizing: border-box; padding: 8px 14px; background: #F7F8F9; border-bottom: 5px solid #D6F53B; display: flex; flex-direction: column; justify-content: space-between">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px">01</span><span style="font-weight: 700; font-size: 14px">Run</span>
    </a>
    <a href="#" style="flex: 1; height: 58px; box-sizing: border-box; padding: 8px 14px; background: #1A2547; color: #D5DBEA; display: flex; flex-direction: column; justify-content: space-between">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px">02</span><span style="font-weight: 600; font-size: 14px">Results</span>
    </a>
    <a href="#" style="flex: 1; height: 58px; box-sizing: border-box; padding: 8px 14px; background: #1A2547; color: #D5DBEA; display: flex; flex-direction: column; justify-content: space-between">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px">03</span><span style="font-weight: 600; font-size: 14px">Device</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      { num: '01', name: 'All cores', tests: [['3D rendering', 1], ['Compiling code', 0], ['Vector maths', 1]] },
      { num: '02', name: 'One core', tests: [['3D rendering', 1], ['Vector maths', 1], ['Compiling', 1], ['Compression', 1], ['Opening a photo', 1], ['Reading JSON', 1], ['Starting a script', 1]] },
      { num: '03', name: 'Memory & timing', tests: [['Memory delay', 1], ['Memory delay, busy', 1], ['Timer, idle', 1], ['Timer, busy', 1]] },
      { num: '04', name: 'Responsiveness', tests: [['Wake-up, 1 ms task', 1], ['Wake-up, 10 ms task', 1], ['Photo from rest', 1], ['Script from rest', 1]] }
    ];
    const groups = data.map((g) => {
      const picked = g.tests.filter((x) => x[1]).length;
      const all = picked === g.tests.length;
      return {
        num: g.num,
        name: g.name,
        count: picked + ' of ' + g.tests.length,
        line: all ? '#0C1430' : '#C9D0DA',
        tileStyle: 'display: flex; flex-direction: column; color: #0C1430; overflow: hidden; background: ' + (all ? '#D6F53B' : '#F7F8F9'),
        tests: g.tests.map(([name, on]) => ({
          name,
          on: !!on,
          boxStyle: 'flex: none; width: 22px; height: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 2px solid ' + (on ? '#0C1430' : '#343E5A') + '; background: ' + (on ? '#0C1430' : 'transparent'),
          dotStyle: 'width: 9px; height: 9px; background: ' + (on ? '#D6F53B' : 'transparent')
        }))
      };
    });
    return { groups };
  }
}
</script>
</body>
</html>
