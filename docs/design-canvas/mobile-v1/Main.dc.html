<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prismark, Run</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Saira:wdth,wght@50..125,100..900&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 402px; height: 874px; box-sizing: border-box; background: {{t.ground}}; display: flex; flex-direction: column; gap: 6px; font-family: Archivo, sans-serif; color: {{t.text}}; overflow: hidden">

  <!-- the machine pass -->
  <section style="flex: 1; min-height: 0; position: relative; overflow: hidden; background: #2D5BFF; color: #F7F8F9; padding: 62px 20px 16px; display: flex; flex-direction: column; justify-content: space-between">
    <div aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(#5C80FF 1.2px, transparent 1.4px); background-size: 22px 22px"></div>
    <div style="position: relative; display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; background: #D6F53B; color: #0C1430">
        <svg viewBox="0 0 64 64" width="26" height="26" aria-hidden="true">
          <path d="M0 37 L21.5 34" stroke="#0C1430" stroke-width="3" fill="none"></path>
          <polygon points="12,52 32,12 52,52" fill="#0C1430"></polygon>
          <rect x="42" y="25" width="22" height="5" fill="#0C1430"></rect>
          <rect x="46.5" y="34" width="17.5" height="5" fill="#2D5BFF"></rect>
          <rect x="51" y="43" width="13" height="5" fill="#0C1430"></rect>
        </svg>
        <span style="font-family: Saira, sans-serif; font-variation-settings: 'wdth' 125; font-weight: 800; font-size: 15px">PRISMARK</span>
      </div>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em">REV. 0.4.3</span>
    </div>

    <div style="position: relative; display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">Processor:</span>
      <div style="display: flex; align-items: flex-end; gap: 12px">
        <h1 style="margin: 0; font-family: Saira, sans-serif; font-variation-settings: 'wdth' 50; font-weight: 600; font-size: 208px; line-height: 0.76; letter-spacing: -0.02em; color: #0C1430">A19</h1>
        <span style="writing-mode: vertical-rl; font-family: Saira, sans-serif; font-variation-settings: 'wdth' 125; font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: 0.02em; color: #F7F8F9">PRO</span>
      </div>
    </div>

    <dl style="position: relative; margin: 0; display: grid; grid-template-columns: 1.5fr 0.8fr 1fr; gap: 12px; padding-top: 12px; border-top: 1px solid #9DB3FF">
      <div>
        <dt style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.04em">CORES</dt>
        <dd style="margin: 4px 0 0; font-weight: 600; font-size: 14px">2 fast + 4 efficient</dd>
      </div>
      <div>
        <dt style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.04em">MEMORY</dt>
        <dd style="margin: 4px 0 0; font-weight: 600; font-size: 14px">12 GB</dd>
      </div>
      <div>
        <dt style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.04em">SYSTEM</dt>
        <dd style="margin: 4px 0 0; font-weight: 600; font-size: 14px">iOS 27.2</dd>
      </div>
    </dl>
  </section>

  <!-- the four groups -->
  <section aria-label="Test groups" style="display: flex; flex-direction: column; gap: 6px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div style="{{g.rowStyle}}">
        <button aria-label="{{g.checkLabel}}" aria-pressed="{{g.on}}" onClick="{{g.toggle}}" style="width: 60px; height: 60px; border: 0; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center">
          <span style="{{g.boxStyle}}"><span style="{{g.dotStyle}}"></span></span>
        </button>
        <a href="PhoneGroup.dc.html" style="flex: 1; min-width: 0; height: 60px; display: flex; align-items: center; gap: 12px; padding-right: 14px">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-weight: 700; font-size: 17px; line-height: 1.15">{{g.name}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px">{{g.count}}</span>
          </span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px">{{g.num}}</span>
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 2 L11 8 L5 14"></path></svg>
        </a>
      </div>
    </sc-for>
  </section>

  <!-- run -->
  <section style="background: {{t.panel}}; padding: 10px 6px 6px; display: flex; flex-direction: column; gap: 8px">
    <p style="margin: 0; padding: 0 8px; font-size: 13px; line-height: 1.3; color: {{t.muted}}">{{runNote}}</p>
    <div style="display: flex; gap: 6px">
      <button aria-pressed="{{quick}}" onClick="{{toggleQuick}}" style="flex: none; width: 112px; height: 64px; border: 0; padding: 8px 10px; background: {{t.raised}}; color: {{t.text}}; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.04em">QUICK</span>
        <span style="{{switchStyle}}">
          <sc-if value="{{quick}}" hint-placeholder-val="{{ false }}">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; color: #0C1430">ON</span>
            <span style="width: 14px; height: 14px; background: #0C1430"></span>
          </sc-if>
          <sc-if value="{{notQuick}}" hint-placeholder-val="{{ true }}">
            <span style="width: 14px; height: 14px; background: {{t.knob}}"></span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; color: {{t.muted}}">OFF</span>
          </sc-if>
        </span>
      </button>
      <a href="{{runHref}}" style="{{runStyle}}">
        <span style="font-family: Saira, sans-serif; font-variation-settings: 'wdth' 125; font-weight: 800; font-size: 17px; white-space: nowrap">{{runLabel}}</span>
        <svg viewBox="0 0 34 16" width="30" height="14" fill="currentColor" aria-hidden="true"><polygon points="0,0 5,0 12,8 5,16 0,16 7,8"></polygon><polygon points="11,0 16,0 23,8 16,16 11,16 18,8"></polygon><polygon points="22,0 27,0 34,8 27,16 22,16 29,8"></polygon></svg>
      </a>
    </div>
  </section>

  <!-- tabs -->
  <nav aria-label="Sections" style="display: flex; gap: 6px; padding-bottom: 28px">
    <a href="Main.dc.html" aria-current="page" style="flex: 1; height: 60px; box-sizing: border-box; padding: 8px 12px; background: {{t.panel}}; color: {{t.text}}; border-bottom: 5px solid #D6F53B; display: flex; flex-direction: column; justify-content: space-between">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px">01</span><span style="font-weight: 700; font-size: 14px">Run</span>
    </a>
    <a href="PhoneRuns.dc.html" style="flex: 1; height: 60px; box-sizing: border-box; padding: 8px 12px; background: {{t.tabIdle}}; color: {{t.tabText}}; display: flex; flex-direction: column; justify-content: space-between">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px">02</span><span style="font-weight: 600; font-size: 14px">Results</span>
    </a>
    <a href="PhoneDevice.dc.html" style="flex: 1; height: 60px; box-sizing: border-box; padding: 8px 12px; background: {{t.tabIdle}}; color: {{t.tabText}}; display: flex; flex-direction: column; justify-content: space-between">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px">03</span><span style="font-weight: 600; font-size: 14px">Device</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { off: {}, quick: false };
  }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const t = dark
      ? { ground: '#070C1F', panel: '#141D3B', raised: '#1F2B52', text: '#E8ECEF', muted: '#AEB8D6', tabIdle: '#0F1730', tabText: '#AEB8D6', knob: '#8591B5', box: '#8591B5' }
      : { ground: '#0C1430', panel: '#F7F8F9', raised: '#E8ECEF', text: '#0C1430', muted: '#3B4660', tabIdle: '#1A2547', tabText: '#D5DBEA', knob: '#343E5A', box: '#343E5A' };
    const list = [
      { id: 'mc', num: '01', name: 'All cores', n: 2 },
      { id: 'st', num: '02', name: 'One core', n: 6 },
      { id: 'mem', num: '03', name: 'Memory & timing', n: 4 },
      { id: 'resp', num: '04', name: 'Responsiveness', n: 4 }
    ];
    const off = this.state.off;
    const groups = list.map((g) => {
      const on = !off[g.id];
      return {
        ...g,
        on,
        count: (on ? g.n : 0) + ' of ' + g.n + ' tests',
        checkLabel: (on ? 'Leave out ' : 'Include ') + g.name,
        toggle: () => this.setState({ off: { ...off, [g.id]: on } }),
        rowStyle: 'display: flex; align-items: center; background: ' + (on ? '#D6F53B' : t.panel) + '; color: ' + (on ? '#0C1430' : t.text),
        boxStyle: 'width: 24px; height: 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 2px solid ' + (on ? '#0C1430' : t.box) + '; background: ' + (on ? '#0C1430' : 'transparent'),
        dotStyle: 'width: 10px; height: 10px; background: ' + (on ? '#D6F53B' : 'transparent')
      };
    });
    const total = list.reduce((s, g) => s + (off[g.id] ? 0 : g.n), 0);
    const quick = this.state.quick;
    const can = total > 0;
    return {
      t,
      groups,
      quick,
      notQuick: !quick,
      toggleQuick: () => this.setState({ quick: !quick }),
      switchStyle: 'display: flex; align-items: center; gap: 6px; padding: 3px 5px; background: ' + (quick ? '#D6F53B' : (dark ? '#0F1730' : '#C9D0DA')),
      runNote: quick ? 'Quick run: short series. A first look, not ranked.' : 'Full run: accurate and ranked. Each test stands on its own.',
      runHref: can ? 'PhoneMeasuring.dc.html' : 'Main.dc.html',
      runLabel: can ? 'RUN ' + total + (total === 1 ? ' TEST' : ' TESTS') : 'PICK A TEST',
      runStyle: 'flex: 1; min-width: 0; height: 64px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: ' + (can ? '#D6F53B' : t.raised) + '; color: ' + (can ? '#0C1430' : t.muted)
    };
  }
}
</script>
</body>
</html>
