<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C, ticket deck, no dock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Saira:wdth,wght@50..125,100..900&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 402px; height: 874px; position: relative; overflow: hidden; background: #0C1430; font-family: Archivo, sans-serif">
  <div style="width: 402px; height: 874px; overflow-y: auto; overflow-x: hidden; box-sizing: border-box; background: #0C1430">
    <sc-for list="{{tickets}}" as="s" hint-placeholder-count="7">
      <section style="{{s.style}}">
        <div style="flex: none; height: 34px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed currentColor; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em">
          <span>{{s.tag}}</span><span>{{s.side}}</span>
        </div>
        <div style="{{s.bodyStyle}}">
          <h2 style="{{s.head}}">{{s.title}}</h2>
          <p style="margin: 0; font-size: 15px; line-height: 1.4">{{s.text}}</p>
          <div style="margin-top: auto; display: flex; flex-direction: column">
            <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="4">
              <a href="{{s.href}}" style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid currentColor">
                <span style="display: flex; align-items: center; gap: 12px; min-width: 0">
                  <span style="{{r.box}}"></span>
                  <span style="font-weight: 600; font-size: 15px; line-height: 1.15">{{r.name}}</span>
                </span>
                <span style="flex: none; font-family: Saira, sans-serif; font-variation-settings: 'wdth' 50; font-weight: 600; font-size: 34px; line-height: 1">{{r.score}}</span>
              </a>
            </sc-for>
          </div>
        </div>
      </section>
    </sc-for>
    <div aria-hidden="true" style="height: 110px"></div>
  </div>

  <!-- the only thing that floats: the action, always under the thumb -->
  <a href="PhoneMeasuring.dc.html" style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 70px; box-sizing: border-box; padding: 0 28px; border-radius: 43px; background: #D6F53B; color: #0C1430; outline: 2px solid #0C1430; outline-offset: -2px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: Saira, sans-serif; font-variation-settings: 'wdth' 125; font-weight: 800; font-size: 18px">RUN 16 TESTS</span>
    <svg viewBox="0 0 34 16" width="32" height="15" fill="currentColor" aria-hidden="true"><polygon points="0,0 5,0 12,8 5,16 0,16 7,8"></polygon><polygon points="11,0 16,0 23,8 16,16 11,16 18,8"></polygon><polygon points="22,0 27,0 34,8 27,16 22,16 29,8"></polygon></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"closed":{"editor":"int","default":0,"min":0,"max":6},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  renderVals() {
    const closed = this.props.closed ?? 0;
    const TOP = 54, STRIP = 34, GAP = 2;
    const on = 'width: 20px; height: 20px; flex: none; box-sizing: border-box; background: currentColor;';
    const off = 'width: 20px; height: 20px; flex: none; box-sizing: border-box; border: 2px solid currentColor;';
    const test = (name, score, picked) => ({ name, score, box: picked === false ? off : on });
    const data = [
      { tag: 'THIS IPHONE', side: 'IOS 27.2', title: 'A19 Pro', size: 96, wdth: 50, text: '2 fast + 4 efficient cores, 12 GB of memory. Each test is ranked on its own. There is no overall score.', bg: '#2D5BFF', fg: '#F7F8F9', href: 'NavDeck.dc.html', rows: [] },
      { tag: '01 · ALL CORES', side: '2 OF 2', title: 'All cores', text: 'Heavy jobs that use every core at once.', bg: '#F7F8F9', fg: '#0C1430', href: 'PhoneTest.dc.html', rows: [test('3D rendering', '19.8'), test('Vector maths', '112')] },
      { tag: '02 · ONE CORE', side: '6 OF 6', title: 'One core', text: 'Short everyday tasks, and long tasks once the core has warmed up.', bg: '#E8ECEF', fg: '#0C1430', href: 'PhoneTest.dc.html', rows: [test('3D rendering', '3.72'), test('Vector maths', '21.8'), test('Compression', '12.6'), test('Opening a photo', '27.2'), test('Reading JSON', '19.3'), test('Starting a script', '10.9')] },
      { tag: '03 · MEMORY & TIMING', side: '4 OF 4', title: 'Memory & timing', text: 'How long the CPU waits for memory, and how punctually it wakes up.', bg: '#F7F8F9', fg: '#0C1430', href: 'PhoneTest.dc.html', rows: [test('Memory delay', '84.1'), test('Memory delay, busy', '89.7'), test('Timer, idle', '448'), test('Timer, busy', '392')] },
      { tag: '04 · RESPONSIVENESS', side: '4 OF 4', title: 'Responsiveness', text: 'How quickly the phone reacts when work arrives while it is resting.', bg: '#E8ECEF', fg: '#0C1430', href: 'PhoneTest.dc.html', rows: [test('Wake-up, 1 ms task', '7.27'), test('Wake-up, 10 ms task', '30.6'), test('Photo from rest', '59.7'), test('Script from rest', '36.2')] },
      { tag: 'YOUR RUNS', side: '4 SAVED', title: '02 Nov', size: 96, wdth: 50, text: 'Your latest run: full, 16 of 16 tests. Earlier runs are below.', bg: '#D6F53B', fg: '#0C1430', href: 'PhoneResults.dc.html', rows: [
        { name: '30 Oct · Quick', score: '16', box: 'display: none' },
        { name: '29 Oct · Full, partial', score: '9', box: 'display: none' },
        { name: '27 Oct · Full, busy', score: '16', box: 'display: none' }
      ] },
      { tag: 'THIS DEVICE', side: 'UNKNOWN: 4', title: 'What iOS will not say', size: 34, text: 'Temperature in degrees, clock speed, core placement and cycle counts are closed to apps. They are recorded as unknown.', bg: '#F7F8F9', fg: '#0C1430', href: 'PhoneDevice.dc.html', rows: [] }
    ];
    const tickets = data.map((d, k) => {
      const isClosed = k < closed;
      return {
        ...d,
        head: "margin: 0; font-family: Saira, sans-serif; font-variation-settings: 'wdth' " + (d.wdth || 112) + '; font-weight: ' + (d.wdth ? 600 : 800) + '; font-size: ' + (d.size || 40) + 'px; line-height: 0.95',
        bodyStyle: isClosed ? 'display: none' : 'flex: 1; min-height: 0; padding-top: 16px; display: flex; flex-direction: column; gap: 12px',
        style: 'position: sticky; top: ' + (TOP + k * (STRIP + GAP)) + 'px; box-sizing: border-box; padding: 0 20px ' + (isClosed ? 0 : 18) + 'px; display: flex; flex-direction: column; border-top: 2px solid #0C1430; background: ' + d.bg + '; color: ' + d.fg + '; height: ' + (isClosed ? STRIP + GAP : 874 - TOP - k * (STRIP + GAP)) + 'px' + (k === 0 ? '; margin-top: ' + TOP + 'px' : '')
      };
    });
    return { tickets };
  }
}
</script>
</body>
</html>
