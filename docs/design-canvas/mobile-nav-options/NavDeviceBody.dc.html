<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Device screen, no navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Saira:wdth,wght@50..125,100..900&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="{{rootStyle}}">
  <header style="flex: none; background: #F7F8F9; padding: 62px 20px 14px; display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-family: Saira, sans-serif; font-variation-settings: 'wdth' 112; font-weight: 700; font-size: 34px; line-height: 1">This iPhone</h1>
    <dl style="margin: 0; display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 5px 10px; font-size: 14px; line-height: 1.3">
      <dt style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #3B4660">Model</dt><dd style="margin: 0; font-weight: 600">iPhone 17 Pro</dd>
      <dt style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #3B4660">Processor</dt><dd style="margin: 0; font-weight: 600">A19 Pro · 2 fast + 4 efficient</dd>
      <dt style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #3B4660">Memory</dt><dd style="margin: 0; font-weight: 600">12 GB</dd>
      <dt style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #3B4660">System</dt><dd style="margin: 0; font-weight: 600">iOS 27.2</dd>
    </dl>
  </header>
  <section style="flex: 1; min-height: 0; overflow: hidden; background: #E8ECEF; padding: 12px 20px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: #3B4660">UNKNOWN ON THIS IPHONE</span>
    <sc-for list="{{unknown}}" as="u" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 8px; border-top: 1px solid #C9D0DA">
        <span style="font-weight: 700; font-size: 14px">{{u.what}}</span>
        <span style="font-size: 13px; line-height: 1.3; color: #3B4660">{{u.why}}</span>
      </div>
    </sc-for>
  </section>
  <a href="https://prismark.leonardonels.com/compare.html" style="{{linkStyle}}">
    <span>Compare processors on the web</span>
    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 13 L13 3 M5 3 H13 V11"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":"int","default":402},"h":{"editor":"int","default":874},"bottom":{"editor":"int","default":34},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  renderVals() {
    const w = this.props.w ?? 402, h = this.props.h ?? 874, bottom = this.props.bottom ?? 34;
    return {
      rootStyle: 'width: ' + w + 'px; height: ' + h + 'px; box-sizing: border-box; background: #0C1430; display: flex; flex-direction: column; gap: 6px; font-family: Archivo, sans-serif; color: #0C1430; overflow: hidden',
      linkStyle: 'flex: none; box-sizing: border-box; padding: 0 20px ' + bottom + 'px; height: ' + (56 + bottom) + 'px; background: #2D5BFF; color: #F7F8F9; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 15px',
      unknown: [
        { what: 'Temperature', why: 'iOS gives apps a coarse thermal state, not degrees.' },
        { what: 'Clock speed', why: 'The CPU clock is not readable by apps on iOS.' },
        { what: 'Core placement', why: 'Threads cannot be pinned to a core; iOS chooses.' },
        { what: 'Cycle counter', why: 'Hardware counters are closed to apps.' }
      ]
    };
  }
}
</script>
</body>
</html>
