<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="color-scheme" content="light dark">
        <meta name="viewport"
            content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&family=Saira:wdth,wght@50..125,100..900&display=swap">
        <link rel="stylesheet" href="styles.css">
        <script src="compare-data.js" defer></script>
        <script src="versus.js" defer></script>
        <title>Prismark - Head to head</title>
    </head>

    <body>
        <svg width="0" height="0" style="position: absolute" aria-hidden="true">
            <symbol id="mark" viewBox="0 0 64 64">
                <polygon points="4,54 26,10 48,54" fill="currentColor"/>
                <polygon points="35.0,18 62,18 62,26 39.0,26" fill="currentColor"/>
                <polygon points="41.0,30 62,30 62,38 45.0,38" fill="var(--signal)"/>
                <polygon points="47.0,42 62,42 62,54 53.0,54" fill="currentColor"/>
            </symbol>
        </svg>

        <div class="ground">
            <header class="row">
                <a class="panel brand" href="index.html">
                    <svg width="32" height="32" aria-hidden="true">
                        <use href="#mark"/>
                    </svg>
                    <span class="wordmark small">PRISMARK</span>
                </a>
                <nav class="row tabs" aria-label="This comparison">
                    <a class="tab wide" id="back" href="compare.html">
                        <span class="label">⟵ 02 · Compare</span>
                        <span>Back to the rankings</span>
                    </a>
                    <button class="tab" id="copy" type="button">
                        <span class="label">Link</span>
                        <span id="copy-text">Copy this comparison</span>
                    </button>
                    <button class="tab" id="swap" type="button">
                        <span class="label">A ⇄ B</span>
                        <span>Swap sides</span>
                    </button>
                </nav>
            </header>

            <section class="row" id="passes" aria-label="The two processors"></section>

            <section class="panel signal no-total">
                <h1 class="heading">No total. Read it test by test.</h1>
                <p>Each row is the same work on both machines. The longer bar is the faster one, whichever way the unit counts.</p>
            </section>

            <div class="versus-groups" id="groups"></div>

            <footer class="footer label">
                <span>Prismark · Apache License 2.0</span>
                <span>Hosted on GitHub Pages</span>
            </footer>
        </div>
    </body>

</html>
